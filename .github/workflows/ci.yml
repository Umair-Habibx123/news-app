name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # .env is listed as an asset in pubspec.yaml, so it must exist. Tests don't need a real key.
      - name: Create an empty .env
        run: touch .env

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
